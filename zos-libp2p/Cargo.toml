[package]
name = "zos-libp2p"
version = "0.1.0"
edition = "2021"

[dependencies]
libp2p = "0.54"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "process", "rt-multi-thread", "macros"] }
libloading = "0.8"
chrono = { version = "0.4", features = ["serde"] }
