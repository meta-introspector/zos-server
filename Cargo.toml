[package]
name = "zos-server"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0"

[[bin]]
name = "zos_server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
zstd = "0.13"
rand = "0.8"
toml = "0.8"
libloading = "0.8"
libp2p = { version = "0.54", features = ["gossipsub", "mdns", "noise", "yamux", "tcp", "tokio"] }
once_cell = "1.19"

# Social plugins (optional)
zos-plugin-pastebin-threads = { git = "https://github.com/meta-introspector/zos-plugin-pastebin-threads", rev = "f6594ed", optional = true }
zos-plugin-activitypub = { git = "https://github.com/meta-introspector/zos-plugin-activitypub", rev = "3bb1218", optional = true }
zos-plugin-mesh = { git = "https://github.com/meta-introspector/zos-plugin-mesh", rev = "810f300", optional = true }
zos-plugin-stego = { git = "https://github.com/meta-introspector/zos-plugin-stego", rev = "b1471be", optional = true }
zos-plugin-ipfs = { git = "https://github.com/meta-introspector/zos-plugin-ipfs", rev = "0f2299f", optional = true }

[features]
default = []
social = [
    "dep:zos-plugin-pastebin-threads",
    "dep:zos-plugin-activitypub",
    "dep:zos-plugin-mesh",
    "dep:zos-plugin-stego",
    "dep:zos-plugin-ipfs",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
members = [
    "zos-macros",
    "zos-traits",
    "zos-types",
    "zos-build-macros",
    "zos-plan",
    "zos-deploy",
    "zos-oracle",
    "zos-unix-accounts",
    "zos-retro-games",
    "zos-minimal-server",
    "zos-libp2p",
    "zos-plugins",
    "zos-bootstrap",
    "zos-oci",
    "zos-analysis"
]
resolver = "2"
